{{- if and (not .Values.secrets.existingSecret) (not .Values.vault.enabled) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pkgaudit.secretName" . }}
  labels: {{- include "pkgaudit.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required "secrets.secretKey is required (or set secrets.existingSecret)" .Values.secrets.secretKey | quote }}
  FERNET_KEY: {{ required "secrets.fernetKey is required (or set secrets.existingSecret)" .Values.secrets.fernetKey | quote }}
  {{- if .Values.postgres.enabled }}
  POSTGRES_PASSWORD: {{ required "secrets.postgresPassword is required (or set secrets.existingSecret)" .Values.secrets.postgresPassword | quote }}
  {{- else }}
  DATABASE_URL: {{ required "externalDatabase.url is required when postgres.enabled=false" .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- if .Values.ldap.enabled }}
  LDAP_BIND_PASSWORD: {{ required "secrets.ldapBindPassword is required when ldap.enabled" .Values.secrets.ldapBindPassword | quote }}
  {{- end }}
{{- end }}
