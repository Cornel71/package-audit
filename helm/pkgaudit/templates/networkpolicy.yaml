{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pkgaudit.fullname" . }}-web
  labels: {{- include "pkgaudit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "pkgaudit.webSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.networkPolicy.traefikNamespace }}}
      ports: [{port: 8000}]
{{- if .Values.postgres.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pkgaudit.fullname" . }}-postgres
  labels: {{- include "pkgaudit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "pkgaudit.dbSelector" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- include "pkgaudit.webSelector" . | nindent 14 }}
      ports: [{port: 5432}]
{{- end }}
{{- end }}
