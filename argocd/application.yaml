apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pkgaudit
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:Cornel71/package-audit.git
    targetRevision: main
    path: helm/pkgaudit
    helm:
      releaseName: pkgaudit
      valuesObject:
        host: audit.alienware.loc
        image:
          repository: docker.io/cornel71/pkgaudit
          tag: "1.0.1"
        imagePullSecrets:
          - name: pkgaudit-regcred
        vault:
          enabled: true
          address: http://vault.vault.svc:8200
          role: pkgaudit
          mount: kv
          paths:
            app: pkgaudit/app
        networkPolicy:
          traefikNamespace: traefik
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
        - .spec.volumeClaimTemplates[]?.status
  destination:
    server: https://kubernetes.default.svc
    namespace: pkgaudit
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/warn: restricted
